version: "2"
linters:
  default: standard
  enable:
    - errorlint
    - bodyclose
    - noctx
  exclusions:
    rules:
      # Test helpers use short-lived plain HTTP calls against the compose stack.
      - path: _test\.go
        linters: [errcheck, noctx, bodyclose]
formatters:
  enable:
    - gofmt
