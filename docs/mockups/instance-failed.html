<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Instance failed · AgentsView Teams</title><link rel="stylesheet" href="mock.css"><script src="mock.js"></script>
<style>.fail{min-height:calc(100vh - 36px);display:grid;place-items:center;padding:var(--s5)}.fail .empty{margin:0}.fail .acts{display:flex;gap:var(--s2);justify-content:center;flex-wrap:wrap;margin-bottom:var(--s5)}.fail .acts .btn{margin:0}.fail .big-i{width:32px;height:32px;color:var(--danger);margin-bottom:var(--s4)}.fail .empty p.sm{margin:0}</style></head>
<body data-bar="slim">
<main class="fail">
  <div class="empty">
    <svg class="i big-i" role="img" aria-label="Error"><use href="#i-alert"/></svg>
    <h1>Your Instance didn't start</h1>
    <p>The agentsview upgrade to 0.47.0 failed. Your sessions are safe, and your Hosts keep queueing uploads until your Instance is back.</p>
    <div class="acts"><button class="btn primary">Try again</button><a class="btn" href="#">View status details</a></div>
    <p class="sm">Admins have been notified.</p>
  </div>
</main>
</body></html>
